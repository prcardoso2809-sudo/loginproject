<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prsolutions - cadrastro</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='slcadastro.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="titulo">
      <h1>Prsolutions - cadastro</h1>
      <h2>menu para cadastro</h2>
    </div>

    <div class="formulario">
      <form action="" method="post">
        <label for="usuario">Usuario:</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          placeholder="digite o usuario de quem sera cadastrado."
          required
        />
        <br />
        <label for="senha">Senha:</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="digite a senha escolhida."
          required
        />
        <br />
        <label>salario inicial R$:</label>
        <input
          type="number"
          name="salario"
          step="0.01"
          placeholder="digite o salario inicial ex:1700.00"
          required
        />
        <br />
        <label>dia do salario</label>
        <input
          type="text"
          name="d_salario"
          placeholder="digite o dia do primeiro salario ex:todo dia 10"
          required
        />
        <br />
        <label>nome e função:</label>
        <input
          type="text"
          name="funcionario"
          placeholder="digite o nome do funcionario"
          required
        />
        <select name="funcao" required>
          <option value="errado" disabled selected>selecione uma função.</option>
          <option value="operador">operador</option>
          <option value="RH">recursos humanos</option>
          <option value="gerente">gerente</option>
        </select>
        <br />
        <button type="submit">cadastrar</button>
        {% with messages = get_flashed_messages() %} {% if messages %} {% for
        message in messages %}
        <p class="erro">{{message}}</p>
        {% endfor %} {% endif %} {% endwith %}
      </form>
    </div>
  </body>
</html>
